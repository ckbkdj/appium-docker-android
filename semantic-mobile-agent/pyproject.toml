[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "semantic-mobile-agent"
version = "0.1.0"
description = "Token-efficient semantic Android control agent with Bridge/ADB/Appium execution."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ckbkdj" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "httpx>=0.27",
  "aiosqlite>=0.20",
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
appium = ["Appium-Python-Client>=4.0"]
mcp = ["mcp>=1.8"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.9",
  "mypy>=1.14",
]
all = [
  "Appium-Python-Client>=4.0",
  "mcp>=1.8",
]

[project.scripts]
mobile-agent-api = "mobile_agent.__main__:main"
mobile-agent-mcp = "mobile_agent.mcp_server:main"
mobile-agent-bench = "mobile_agent.benchmark:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mobile_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = false
plugins = ["pydantic.mypy"]
