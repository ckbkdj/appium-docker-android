name: Semantic Mobile Agent CI

on:
  pull_request:
    paths:
      - "semantic-mobile-agent/**"
      - ".github/workflows/semantic-mobile-agent-ci.yml"
  push:
    branches:
      - "feat/semantic-mobile-agent-release"
    paths:
      - "semantic-mobile-agent/**"
      - ".github/workflows/semantic-mobile-agent-ci.yml"

concurrency:
  group: semantic-mobile-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: semantic-mobile-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: semantic-mobile-agent/pyproject.toml
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check src tests
      - name: Compile
        run: python -m compileall -q src tests
      - name: Tests
        run: pytest -q

  android-bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: semantic-mobile-agent/android-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
