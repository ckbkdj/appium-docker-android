name: Semantic Mobile Agent CI

on:
  push:
    branches:
      - master
      - feat/semantic-mobile-agent
    paths:
      - "semantic-mobile-agent/**"
      - ".github/workflows/semantic-mobile-agent.yml"
  pull_request:
    paths:
      - "semantic-mobile-agent/**"
      - ".github/workflows/semantic-mobile-agent.yml"

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: semantic-mobile-agent
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: semantic-mobile-agent/pyproject.toml

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Lint
        run: python -m ruff check src tests

      - name: Test
        run: python -m pytest -q
